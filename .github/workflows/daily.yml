name: daily-radar

on:
  schedule:
    # UTC 01:00 = 北京时间 09:00，每天自动出报
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成日报
        run: python3 -m radar --tier free
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADAR_API_KEY: ${{ secrets.RADAR_API_KEY }}

      - name: 提交归档
        run: |
          git config user.name "daily-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add output
          git diff --staged --quiet || git commit -m "chore: 日报 $(date -u +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
